name: tauntpuzz
description: Slide Puzzle Game Made With Flutter For The Flutter Puzzle Hack Challenge

publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+19

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.4
  collection: ^1.19.1
  provider: ^6.0.3
  equatable: ^2.0.8
  package_info_plus: ^10.1.0
  hive: ^2.2.1
  hive_flutter: ^1.1.0
  get_it: ^9.2.1
  share_plus: ^13.0.1
  path_provider: ^2.0.10
  http: ^1.6.0
  url_launcher: ^6.1.2
  font_awesome_flutter: ^11.0.0
  desktop_window: ^0.4.3
  cross_file: ^0.3.5+2
  go_router: ^17.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3
  mocktail: ^1.0.4
  path_provider_platform_interface: ^2.0.4
  plugin_platform_interface: ^2.1.2
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/puzzle-solved/
    - assets/images/background/
  fonts:
    - family: PaytoneOne
      fonts:
        - asset: assets/fonts/PaytoneOne/PaytoneOne-Regular.ttf
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat/Montserrat-Variable.ttf

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/app-icon-with-dash-ltr.png"
